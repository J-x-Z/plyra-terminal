[package]
name = "mcp-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "io-util", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = "0.3"
url = "2"
process-wrap = { version = "10", features = ["tokio1"] }
axum = { version = "0.8", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["reqwest-native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
rmcp = { version = "=3.9.0", default-features = false, features = ["reqwest-tls-no-provider"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "=1.0.12", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
owned-fixture = ["rmcp/server", "rmcp/transport-io", "rmcp/transport-streamable-http-server", "dep:axum"]

[[bin]]
name = "glass-owned-mcp-fixture"
path = "src/bin/owned_fixture.rs"
required-features = ["owned-fixture"]

# FVPROV1 1485  FVPROV1-END
