[package]
name = "terminal-render"
version.workspace = true
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
egui = "=0.31.1"
egui-wgpu = "=0.31.1"
glyphon = "=0.8.0"
lru = { version = "=0.12.5", default-features = false }
png = "0.17"
pollster = "=0.4.0"
raw-window-handle = "=0.6.2"
terminal-core = { path = "../terminal-core" }
wgpu = "=24.0.5"
winit = "=0.30.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wayland-backend = { version = "=0.3.17", features = ["client_system", "dlopen"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
x11rb = "=0.13.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.5.3"
objc2-foundation = { version = "=0.2.2", features = ["NSGeometry", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
] }
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# FVPROV1 1285  FVPROV1-END
