[package]
name = "glass-terminal-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
winit.workspace = true
egui = "=0.31.1"
egui-winit = { version = "=0.31.1", default-features = false, features = ["clipboard", "links"] }
terminal-core = { path = "../../crates/terminal-core" }
session-manager = { path = "../../crates/session-manager" }
terminal-render = { path = "../../crates/terminal-render" }
system-api = { path = "../../crates/system-api" }
mcp-client = { path = "../../crates/mcp-client" }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "=3.6.1", default-features = false }
block2 = "=0.5.1"
objc2 = "=0.5.3"
objc2-foundation = { version = "=0.2.2", features = ["NSString", "NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
egui-winit = { version = "=0.31.1", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "glass-terminal"
path = "src/main.rs"

# FVPROV1 1226  FVPROV1-END
