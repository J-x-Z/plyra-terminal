[package]
name = "glass-terminal-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "glass_terminal_android"
crate-type = ["cdylib"]

[[bin]]
name = "glass-android-root-broker"
path = "src/bin/root_broker.rs"

[target.'cfg(target_os = "android")'.dependencies]
anyhow.workspace = true
flate2 = "1"
libc = "0.2"
serde_json.workspace = true
sha2 = "0.10"
tar = { version = "=0.4.45", default-features = false }
tempfile = "3"
glass-terminal-desktop = { path = "../desktop" }
system-api = { path = "../../crates/system-api" }
terminal-render = { path = "../../crates/terminal-render" }
privilege-broker = { path = "../../crates/privilege-broker" }
jni = "=0.22.4"
winit = { workspace = true, features = ["android-native-activity"] }

[package.metadata.android]
package = "org.plyra.glass.terminal"
apk_name = "glass-terminal-g1"
build_targets = ["aarch64-linux-android", "x86_64-linux-android", "armv7-linux-androideabi", "i686-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Plyra Terminal"

[package.metadata.android.application.activity]
name = "org.plyra.glass.terminal.GlassTerminalActivity"
exported = true

# FVPROV1 1251  FVPROV1-END
