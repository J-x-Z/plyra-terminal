[workspace]
members = ["crates/terminal-core", "crates/session-manager", "crates/terminal-render", "crates/system-api", "crates/mcp-client", "crates/privilege-policy", "crates/privilege-broker", "apps/desktop", "apps/android"]
exclude = ["vendor/block", "vendor/vt100", "vendor/wgpu-hal"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "=0.30.13"

[patch.crates-io]
block = { path = "vendor/block" }
vt100 = { path = "vendor/vt100" }
wgpu-hal = { path = "vendor/wgpu-hal" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = true

# FVPROV1 739  FVPROV1-END
